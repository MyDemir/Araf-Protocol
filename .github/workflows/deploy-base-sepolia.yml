name: Deploy Base Sepolia

# Tam deploy: kontrat (contracts/scripts/deploy.js) + opsiyonel revenue vault/rewards (deployRewards.js,
# deploy_rewards=true) + backend (Fly.io) + opsiyonel frontend (Vercel).
# deployRewards.js vault.setRewards'ı TEK SEFER çağırır (geri alınamaz); varsayılan kapalıdır ve mevcut bir
# rewards kurulumu varken yalnız confirm_redeploy_rewards=YES ile çalışır. escrow.setTreasury(vault) bu
# workflow'da YAPILMAZ: escrow owner'ının (multisig) ayrı işlemidir (docs/*/DEPLOYMENT_GUIDE.md).
# Fly secret / Vercel env listesi ve health kontrolü .github/scripts/stage-runtime-env.sh'te ortaktır.

on:
  workflow_dispatch:
    inputs:
      deploy_frontend:
        description: "Also deploy frontend to Vercel"
        required: false
        default: false
        type: boolean
      deploy_test_usdt:
        description: "Deploy a test USDT (tUSDT, MockERC20) first if the BASE_SEPOLIA_USDT_ADDRESS variable is empty"
        required: false
        default: false
        type: boolean
      deploy_rewards:
        description: "Also deploy ArafRevenueVault + ArafRewards for the new escrow (one-shot vault.setRewards; does NOT switch the escrow treasury)"
        required: false
        default: false
        type: boolean
      confirm_redeploy_rewards:
        description: "Type YES to deploy rewards even though ARAF_REVENUE_VAULT_ADDRESS/ARAF_REWARDS_ADDRESS (or an on-chain rewards setup) already exist. Old vault/rewards are orphaned."
        required: false
        default: ""
        type: string
      verify_contracts:
        description: "Experimental: verify contracts on BaseScan via Etherscan V2, Sourcify and Blockscout (ETHERSCAN_API_KEY secret optional; legacy BASESCAN_API_KEY is still read; Sourcify/Blockscout are keyless)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-base-sepolia
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy contracts and backend
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      FLY_APP_NAME: ${{ vars.FLY_APP_NAME || 'araf-protocol-backend' }}
      FRONTEND_DOMAIN: ${{ vars.FRONTEND_DOMAIN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Validate required config
        shell: bash
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
          BASE_SEPOLIA_WS_RPC_URL: ${{ secrets.BASE_SEPOLIA_WS_RPC_URL }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MASTER_ENCRYPTION_KEY: ${{ secrets.MASTER_ENCRYPTION_KEY }}
          TREASURY_ADDRESS: ${{ vars.TREASURY_ADDRESS }}
          FINAL_OWNER_ADDRESS: ${{ vars.FINAL_OWNER_ADDRESS }}
          BASE_SEPOLIA_USDT_ADDRESS: ${{ vars.BASE_SEPOLIA_USDT_ADDRESS }}
          BASE_SEPOLIA_USDC_ADDRESS: ${{ vars.BASE_SEPOLIA_USDC_ADDRESS }}
          DEPLOY_TEST_USDT: ${{ inputs.deploy_test_usdt }}
          DEPLOY_REWARDS: ${{ inputs.deploy_rewards }}
          CONFIRM_REDEPLOY_REWARDS: ${{ inputs.confirm_redeploy_rewards }}
          FINAL_TREASURY_ADDRESS: ${{ vars.FINAL_TREASURY_ADDRESS }}
          VAR_REVENUE_VAULT: ${{ vars.ARAF_REVENUE_VAULT_ADDRESS }}
          VAR_REWARDS: ${{ vars.ARAF_REWARDS_ADDRESS }}
          BASE_SEPOLIA_RPC_URL_FALLBACKS: ${{ secrets.BASE_SEPOLIA_RPC_URL_FALLBACKS }}
          ADMIN_WALLETS: ${{ vars.ADMIN_WALLETS }}
          LIVE_POLL_INTERVAL_MS: ${{ vars.LIVE_POLL_INTERVAL_MS }}
          WORKER_BLOCK_BATCH_SIZE: ${{ vars.WORKER_BLOCK_BATCH_SIZE }}
          WORKER_REPLAY_BATCH_DELAY_MS: ${{ vars.WORKER_REPLAY_BATCH_DELAY_MS }}
          EXPECTED_CHAIN_ID: ${{ vars.EXPECTED_CHAIN_ID }}
        run: |
          set -euo pipefail
          ADDRESS_RE='^0x[a-fA-F0-9]{40}$'
          need() { test -n "${!1}" || { echo "::error::$1 is required (see docs/EN/DEPLOY_BASE_SEPOLIA.md)."; exit 1; }; }
          addr() { [[ "${!1}" =~ $ADDRESS_RE ]] || { echo "::error::$1 must be a 0x + 40 hex address."; exit 1; }; }

          need FRONTEND_DOMAIN
          for n in DEPLOYER_PRIVATE_KEY BASE_SEPOLIA_RPC_URL BASE_SEPOLIA_WS_RPC_URL FLY_API_TOKEN MONGODB_URI REDIS_URL JWT_SECRET MASTER_ENCRYPTION_KEY; do need "$n"; done
          for n in TREASURY_ADDRESS FINAL_OWNER_ADDRESS BASE_SEPOLIA_USDC_ADDRESS; do need "$n"; addr "$n"; done
          # USDT: variable dolu olmalı; yalnız deploy_test_usdt=true iken boş olabilir (test token otomatik deploy edilir).
          if [ -n "$BASE_SEPOLIA_USDT_ADDRESS" ]; then
            addr BASE_SEPOLIA_USDT_ADDRESS
          elif [ "$DEPLOY_TEST_USDT" != "true" ]; then
            echo "::error::BASE_SEPOLIA_USDT_ADDRESS is required unless deploy_test_usdt=true (see docs/EN/DEPLOY_BASE_SEPOLIA.md)."; exit 1
          fi

          [[ "${TREASURY_ADDRESS,,}" != "${FINAL_OWNER_ADDRESS,,}" ]] || { echo "::error::FINAL_OWNER_ADDRESS must differ from TREASURY_ADDRESS (deploy.js rejects equal values on public chains)."; exit 1; }
          [[ "$FRONTEND_DOMAIN" != http* && "$FRONTEND_DOMAIN" != */* ]] || { echo "::error::FRONTEND_DOMAIN must be a bare host (no https://, no path)."; exit 1; }
          [[ "$FRONTEND_DOMAIN" != "localhost" ]] || { echo "::error::FRONTEND_DOMAIN cannot be localhost."; exit 1; }
          [[ "$BASE_SEPOLIA_RPC_URL" == http* ]] || { echo "::error::BASE_SEPOLIA_RPC_URL must be http(s)."; exit 1; }
          [[ "$BASE_SEPOLIA_WS_RPC_URL" == wss://* ]] || { echo "::error::BASE_SEPOLIA_WS_RPC_URL must start with wss:// (backend eventListener only uses wss://; ws:// silently falls back to HTTP)."; exit 1; }
          [[ "$REDIS_URL" == rediss://* ]] || { echo "::error::REDIS_URL must be rediss:// (backend requires Redis TLS in production)."; exit 1; }
          [[ "$DEPLOYER_PRIVATE_KEY" =~ ^(0x)?[a-fA-F0-9]{64}$ ]] || { echo "::error::DEPLOYER_PRIVATE_KEY must be a 32-byte hex key."; exit 1; }
          [[ ${#JWT_SECRET} -ge 64 ]] || { echo "::error::JWT_SECRET must be at least 64 characters."; exit 1; }
          # Mirrors backend siwe.js SEC-02 (known placeholders + Shannon entropy >= 3.5); never prints the secret.
          python3 - <<'PY' || { echo "::error::JWT_SECRET is a known placeholder or has too low entropy (backend siwe.js would reject it)."; exit 1; }
          import math, os, sys
          s = os.environ["JWT_SECRET"]
          if any(p in s for p in ["CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_MIN_64_CHARS", "your-secret-here", "supersecretkey", "changeme"]):
              sys.exit(1)
          h = -sum((s.count(c) / len(s)) * math.log2(s.count(c) / len(s)) for c in set(s))
          sys.exit(1 if h < 3.5 else 0)
          PY
          [[ "$MASTER_ENCRYPTION_KEY" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "::error::MASTER_ENCRYPTION_KEY must be exactly 64 hex characters."; exit 1; }

          # Rewards kilidi escrow deploy'undan ÖNCE çalışır (yarım kalmış deploy olmasın).
          [[ -z "$CONFIRM_REDEPLOY_REWARDS" || "$CONFIRM_REDEPLOY_REWARDS" == "YES" ]] || { echo "::error::confirm_redeploy_rewards must be empty or exactly YES."; exit 1; }
          if [ "$DEPLOY_REWARDS" = "true" ]; then
            need FINAL_TREASURY_ADDRESS; addr FINAL_TREASURY_ADDRESS
            [[ "${FINAL_TREASURY_ADDRESS,,}" != "0x0000000000000000000000000000000000000000" ]] || { echo "::error::FINAL_TREASURY_ADDRESS cannot be the zero address."; exit 1; }
            if { [ -n "$VAR_REVENUE_VAULT" ] || [ -n "$VAR_REWARDS" ]; } && [ "$CONFIRM_REDEPLOY_REWARDS" != "YES" ]; then
              echo "::error::Rewards already recorded (ARAF_REVENUE_VAULT_ADDRESS/ARAF_REWARDS_ADDRESS variables are set). vault.setRewards is one-shot; a redeploy orphans the old vault/rewards. Re-run with confirm_redeploy_rewards=YES only if intended."; exit 1
            fi
          elif [ -n "$CONFIRM_REDEPLOY_REWARDS" ]; then
            echo "::warning::confirm_redeploy_rewards is ignored because deploy_rewards=false."
          fi
          bash .github/scripts/stage-runtime-env.sh validate-optional

      - name: Install contract dependencies
        working-directory: contracts
        run: npm ci

      - name: Compile contracts
        working-directory: contracts
        run: npx hardhat compile

      # deploy_test_usdt=true ve BASE_SEPOLIA_USDT_ADDRESS boşsa tUSDT (MockERC20) deploy edilir; adres TEST_USDT_ADDRESS olarak sonraki adımlara geçer.
      - name: Deploy test USDT (optional)
        if: ${{ inputs.deploy_test_usdt }}
        working-directory: contracts
        shell: bash
        env:
          CONFIRM_TEST_TOKEN_DEPLOY: "yes"
          TEST_TOKEN_SYMBOL: tUSDT
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
          BASE_SEPOLIA_USDT_ADDRESS: ${{ vars.BASE_SEPOLIA_USDT_ADDRESS }}
          GH_TOKEN: ${{ secrets.GH_VARIABLES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SEPOLIA_USDT_ADDRESS" ]; then
            echo "::notice::BASE_SEPOLIA_USDT_ADDRESS variable is already set; deploy_test_usdt input ignored."
            exit 0
          fi
          npx hardhat run scripts/deployTestToken.js --network base-sepolia 2>&1 | tee "$RUNNER_TEMP/test-token.log"
          addr=$(node -e '
            const fs = require("fs");
            const list = JSON.parse(fs.readFileSync("deployments/base-sepolia-test-tokens.json", "utf8"));
            const arr = Array.isArray(list) ? list : [list];
            const last = arr[arr.length - 1] || {};
            process.stdout.write(String(last.address || ""));
          ')
          [[ "$addr" =~ ^0x[a-fA-F0-9]{40}$ ]] || { echo "::error::test token manifest address invalid."; exit 1; }
          echo "TEST_USDT_ADDRESS=$addr" >> "$GITHUB_ENV"
          echo "Test USDT deployed: $addr"
          if [ -n "$GH_TOKEN" ]; then
            gh variable set BASE_SEPOLIA_USDT_ADDRESS --body "$addr" --repo "$GITHUB_REPOSITORY"
            echo "Repository variable BASE_SEPOLIA_USDT_ADDRESS updated."
          else
            echo "::warning::GH_VARIABLES_TOKEN secret is not set; BASE_SEPOLIA_USDT_ADDRESS was NOT persisted (command is in the job summary)."
          fi
          # Aynı DEPLOYER anahtarı deploy.js'te hemen kullanılacak; nonce/RPC yayılım çakışmasını önlemek için kısa bekleme.
          sleep 15

      # Secret'lar yalnız bu adımın ortam değişkenlerinde; contracts/.env dosyası yazılmaz.
      - name: Deploy contracts to Base Sepolia
        working-directory: contracts
        shell: bash
        env:
          CONFIRM_PUBLIC_DEPLOY: "yes"
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
          TREASURY_ADDRESS: ${{ vars.TREASURY_ADDRESS }}
          FINAL_OWNER_ADDRESS: ${{ vars.FINAL_OWNER_ADDRESS }}
          BASE_SEPOLIA_USDT_ADDRESS: ${{ env.TEST_USDT_ADDRESS || vars.BASE_SEPOLIA_USDT_ADDRESS }}
          BASE_SEPOLIA_USDC_ADDRESS: ${{ vars.BASE_SEPOLIA_USDC_ADDRESS }}
        run: |
          set -euo pipefail
          npx hardhat run scripts/deploy.js --network base-sepolia 2>&1 | tee "$RUNNER_TEMP/deploy.log"

      # deploy.js deploy bloğunu ve VITE_* satırlarını basmaz; değerler manifest + tx receipt'ten okunur.
      - name: Export deployment values
        working-directory: contracts
        shell: bash
        env:
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const { ethers } = require("ethers");
            (async () => {
              const m = JSON.parse(fs.readFileSync("deployments/base-sepolia.json", "utf8"));
              const re = /^0x[a-fA-F0-9]{40}$/;
              if (m.chainId !== 84532 || m.network !== "base-sepolia") throw new Error("manifest is not base-sepolia/84532");
              if (!re.test(m.escrowAddress || "")) throw new Error("manifest.escrowAddress invalid");
              if (!m.deployTxHash) throw new Error("manifest.deployTxHash missing");
              const tok = (s) => (m.tokens || []).find((t) => t.symbol === s);
              const usdt = tok("USDT") && tok("USDT").address;
              const usdc = tok("USDC") && tok("USDC").address;
              if (!re.test(usdt || "") || !re.test(usdc || "")) throw new Error("manifest.tokens USDT/USDC invalid");
              const provider = new ethers.JsonRpcProvider(process.env.BASE_SEPOLIA_RPC_URL);
              const rc = await provider.getTransactionReceipt(m.deployTxHash);
              if (!rc || !rc.blockNumber) throw new Error("deploy tx receipt not found");
              const out = [
                "ESCROW=" + m.escrowAddress,
                "USDT=" + usdt,
                "USDC=" + usdc,
                "DEPLOY_BLOCK=" + rc.blockNumber,
              ];
              fs.appendFileSync(process.env.GITHUB_ENV, out.join("\n") + "\n");
              console.log(out.join("\n"));
            })().catch((e) => { console.error("::error::" + e.message); process.exit(1); });
          '

      # deployRewards.js: Vault(escrow, FINAL_TREASURY, deployer) -> Rewards(escrow, vault, deployer) ->
      # vault.setRewards (TEK SEFER) -> setSupportedToken(USDT/USDC) -> vault+rewards ownership -> FINAL_OWNER.
      # Script tx göndermeden önce kilidi çalıştırır. Runner'da manifest yok: asıl dayanak repo variable'larıdır
      # (EXISTING_*; GH_VARIABLES_TOKEN ile yazılır). Zincir kontrolü yalnız bu adresler biliniyorsa ek güvencedir.
      - name: Deploy revenue vault + rewards (optional)
        if: ${{ inputs.deploy_rewards }}
        working-directory: contracts
        shell: bash
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
          FINAL_OWNER_ADDRESS: ${{ vars.FINAL_OWNER_ADDRESS }}
          FINAL_TREASURY_ADDRESS: ${{ vars.FINAL_TREASURY_ADDRESS }}
          EXISTING_REVENUE_VAULT_ADDRESS: ${{ vars.ARAF_REVENUE_VAULT_ADDRESS }}
          EXISTING_REWARDS_ADDRESS: ${{ vars.ARAF_REWARDS_ADDRESS }}
          CONFIRM_REDEPLOY_REWARDS: ${{ inputs.confirm_redeploy_rewards }}
        run: |
          set -euo pipefail
          # Aynı DEPLOYER anahtarı az önce kullanıldı; nonce/RPC yayılım çakışmasını önlemek için kısa bekleme.
          sleep 10
          ARAF_ESCROW_ADDRESS="$ESCROW" BASE_SEPOLIA_USDT_ADDRESS="$USDT" BASE_SEPOLIA_USDC_ADDRESS="$USDC" \
            npx hardhat run scripts/deployRewards.js --network base-sepolia 2>&1 | tee "$RUNNER_TEMP/deploy-rewards.log"

      # deployRewards başarısızsa (pending) manifest kaybolmasın: adresler ve deployer owner bilgisi için yükle.
      - name: Upload rewards manifest on failure
        if: ${{ failure() && inputs.deploy_rewards }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: base-sepolia-rewards-manifest
          path: contracts/deployments/base-sepolia-rewards.json
          if-no-files-found: ignore
          retention-days: 30

      # deploy_rewards=true: adresler manifest'ten (repo variable'larıyla çelişirse hata).
      # deploy_rewards=false: repo variable'ları yedektir. Her iki modda zincir kontrolü (eth_call):
      # vault.escrow()==ESCROW, rewards.escrow()==ESCROW, rewards.revenueVault()==vault.
      #   manifest modu: uyumsuzluk ::error::.
      #   fallback modu: uyumsuzluk/okuma hatası -> vault/rewards runtime'a VERİLMEZ, Fly/Vercel'deki eski değerler
      #   boşaltılır (REWARDS_UNBOUND=1). Escrow deploy'u tamamlandığı için iş durdurulmaz (yarım kalmasın).
      - name: Resolve revenue vault + rewards addresses
        if: ${{ env.ESCROW != '' }}
        shell: bash
        env:
          MODE: ${{ inputs.deploy_rewards && 'manifest' || 'fallback' }}
          ON_MISMATCH: ${{ inputs.deploy_rewards && 'error' || 'clear' }}
          MANIFEST_PATH: contracts/deployments/base-sepolia-rewards.json
          EXPECTED_CHAIN_ID: "84532"
          VAR_REVENUE_VAULT: ${{ vars.ARAF_REVENUE_VAULT_ADDRESS }}
          VAR_REWARDS: ${{ vars.ARAF_REWARDS_ADDRESS }}
          ALLOW_VARS_REPLACE: ${{ inputs.confirm_redeploy_rewards == 'YES' && 'true' || 'false' }}
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
          BASE_SEPOLIA_RPC_URL_FALLBACKS: ${{ secrets.BASE_SEPOLIA_RPC_URL_FALLBACKS }}
        run: |
          set -euo pipefail
          out="$(node .github/scripts/resolve-rewards-addresses.js)"
          echo "$out"
          REVENUE_VAULT="$(printf '%s\n' "$out" | sed -n 's/^REVENUE_VAULT=//p')"
          REWARDS="$(printf '%s\n' "$out" | sed -n 's/^REWARDS=//p')"
          export REVENUE_VAULT REWARDS
          bash .github/scripts/stage-runtime-env.sh rewards-binding

      # Deneysel: scripts/verify.js (Etherscan V2 + Sourcify). Library'ler, escrow ve (varsa) vault/rewards,
      # constructor argümanları deployments/*.json manifestlerinden okunur. Başarısızlık deploy'u durdurmaz.
      # Secret adı ETHERSCAN_API_KEY; eski BASESCAN_API_KEY geriye uyumlu okunur. Değer asla yazdırılmaz.
      - name: Verify contracts on BaseScan (experimental)
        if: ${{ inputs.verify_contracts }}
        continue-on-error: true
        working-directory: contracts
        shell: bash
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY || secrets.BASESCAN_API_KEY }}
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
        run: |
          set -euo pipefail
          if [ -z "$ETHERSCAN_API_KEY" ]; then
            echo "::warning::ETHERSCAN_API_KEY (or legacy BASESCAN_API_KEY) secret is not set; Etherscan will be skipped, keyless Sourcify + Blockscout will be used."
          fi
          npm run verify:base-sepolia

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@1.5

      # App yoksa oluşturur (FLY_API_TOKEN org/kişisel token olmalı); var olan app'e dokunmaz.
      - name: Ensure Fly app exists
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG: ${{ vars.FLY_ORG }}
        run: |
          set -euo pipefail
          if flyctl status -a "$FLY_APP_NAME" >/dev/null 2>&1; then
            echo "Fly app $FLY_APP_NAME exists."
          else
            echo "Fly app $FLY_APP_NAME not found; creating in org ${FLY_ORG:-personal}."
            if ! flyctl apps create "$FLY_APP_NAME" --org "${FLY_ORG:-personal}"; then
              # Create başarısızsa app gerçekten var mı (status okunamadı) yoksa token mı yetersiz ayır.
              if flyctl apps list --json 2>/dev/null | FLY_APP_NAME="$FLY_APP_NAME" python3 -c 'import json,os,sys; n=os.environ["FLY_APP_NAME"]; d=json.load(sys.stdin); sys.exit(0 if any(isinstance(a,dict) and n in (a.get("Name"),a.get("name")) for a in d) else 1)'; then
                echo "::error::Fly app var ama status okunamadı: token yetkisini kontrol edin."; exit 1
              fi
              echo "::error::Fly app yok ve token app oluşturamıyor; Fly dashboard'dan org token üretin ya da app'i oluşturun (docs/TR/DEPLOY_BASE_SEPOLIA.md)."; exit 1
            fi
          fi

      # Liste ortak: .github/scripts/stage-runtime-env.sh. Secret'lar komut satırına değil flyctl stdin'ine verilir,
      # log'a yalnız ADLAR basılır; --stage ile deploy'a kadar uygulanmaz. Boş opsiyonel değer Fly'daki değeri korur.
      - name: Stage backend secrets on Fly
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MASTER_ENCRYPTION_KEY: ${{ secrets.MASTER_ENCRYPTION_KEY }}
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
          BASE_SEPOLIA_WS_RPC_URL: ${{ secrets.BASE_SEPOLIA_WS_RPC_URL }}
          BASE_SEPOLIA_RPC_URL_FALLBACKS: ${{ secrets.BASE_SEPOLIA_RPC_URL_FALLBACKS }}
          RELAYER_PRIVATE_KEY: ${{ secrets.RELAYER_PRIVATE_KEY }}
          ADMIN_WALLETS: ${{ vars.ADMIN_WALLETS }}
          LIVE_POLL_INTERVAL_MS: ${{ vars.LIVE_POLL_INTERVAL_MS }}
          WORKER_BLOCK_BATCH_SIZE: ${{ vars.WORKER_BLOCK_BATCH_SIZE }}
          WORKER_REPLAY_BATCH_DELAY_MS: ${{ vars.WORKER_REPLAY_BATCH_DELAY_MS }}
          EXPECTED_CHAIN_ID: ${{ vars.EXPECTED_CHAIN_ID }}
        run: |
          set -euo pipefail
          bash .github/scripts/stage-runtime-env.sh validate
          bash .github/scripts/stage-runtime-env.sh fly-secrets

      - name: Deploy backend to Fly
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only -a "$FLY_APP_NAME"

      # Eski escrow'un Redis checkpoint'i (worker:last_block / worker:last_safe_block) escrow'a bağlı değildir; silinmezse worker
      # yeni deploy bloğunu atlayabilir. Yarışı önlemek için tüm makineler durdurulur, yalnız bu iki anahtar silinir, makineler
      # başlatılır (hata olsa da). Bu adım yalnız kontrat deploy eden bu workflow'dadır. Secret basılmaz.
      - name: Reset worker checkpoint for new deployment
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: bash .github/scripts/reset-worker-checkpoint.sh

      # /health 200 zorunlu; /ready 503 degraded:true ise yalnız ::warning:: (deploy başarılı sayılır).
      - name: Check backend health
        shell: bash
        run: bash .github/scripts/stage-runtime-env.sh health

      - name: Validate Vercel config
        if: ${{ inputs.deploy_frontend }}
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "::error::VERCEL_TOKEN secret is required when deploy_frontend is true."; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "::error::VERCEL_ORG_ID secret is required when deploy_frontend is true."; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "::error::VERCEL_PROJECT_ID secret is required when deploy_frontend is true."; exit 1; }

      # Repo dosyası değişmez; yalnız runner üzerindeki kopyada /api rewrite hedefi FLY_APP_NAME'e çevrilir.
      - name: Point vercel.json /api rewrite at Fly app
        if: ${{ inputs.deploy_frontend }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FLY_APP_NAME" =~ ^[a-z0-9-]+$ ]] || { echo "::error::FLY_APP_NAME must match ^[a-z0-9-]+$."; exit 1; }
          node -e '
            const fs = require("fs");
            const p = "frontend/vercel.json";
            const cfg = JSON.parse(fs.readFileSync(p, "utf8"));
            const r = (cfg.rewrites || []).find((x) => x.source === "/api/(.*)");
            if (!r) throw new Error("vercel.json has no /api/(.*) rewrite");
            r.destination = "https://" + process.env.FLY_APP_NAME + ".fly.dev/api/$1";
            fs.writeFileSync(p, JSON.stringify(cfg, null, 2) + "\n");
            console.log("vercel.json /api rewrite destination: " + r.destination);
          '

      - name: Install Vercel CLI
        if: ${{ inputs.deploy_frontend }}
        run: npm install -g vercel@62.7.0

      # VITE_API_URL bilerek verilmez: frontend/src/app/apiConfig.js prod'da mutlak URL'i reddeder, /api rewrite kullanılır.
      # Build-env listesi ortak: .github/scripts/stage-runtime-env.sh (VITE_REVENUE_VAULT_ADDRESS, VITE_REWARDS_ADDRESS dahil).
      - name: Deploy frontend to Vercel
        if: ${{ inputs.deploy_frontend }}
        working-directory: frontend
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_RPC_URL: ${{ vars.VITE_RPC_URL }}
          VITE_BASE_APP_ID: ${{ vars.VITE_BASE_APP_ID }}
          VITE_WALLETCONNECT_PROJECT_ID: ${{ vars.VITE_WALLETCONNECT_PROJECT_ID }}
          FARCASTER_ACCOUNT_ASSOCIATION_HEADER: ${{ vars.FARCASTER_ACCOUNT_ASSOCIATION_HEADER }}
          FARCASTER_ACCOUNT_ASSOCIATION_PAYLOAD: ${{ vars.FARCASTER_ACCOUNT_ASSOCIATION_PAYLOAD }}
          FARCASTER_ACCOUNT_ASSOCIATION_SIGNATURE: ${{ vars.FARCASTER_ACCOUNT_ASSOCIATION_SIGNATURE }}
        run: bash ../.github/scripts/stage-runtime-env.sh vercel-deploy

      # GITHUB_TOKEN repo variable yazamaz; opsiyonel GH_VARIABLES_TOKEN (fine-grained PAT, Variables: read and write) varsa kalıcılaştırılır.
      - name: Persist deployment variables
        if: ${{ always() && env.ESCROW != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_VARIABLES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$GH_TOKEN" ]; then
            gh variable set ARAF_ESCROW_ADDRESS --body "$ESCROW" --repo "$GITHUB_REPOSITORY"
            gh variable set ARAF_DEPLOYMENT_BLOCK --body "$DEPLOY_BLOCK" --repo "$GITHUB_REPOSITORY"
            echo "Repository variables ARAF_ESCROW_ADDRESS / ARAF_DEPLOYMENT_BLOCK updated."
            # Yalnız bu çalıştırmada deploy edilen (manifest kaynaklı) vault/rewards yazılır; yedek değer geri yazılmaz.
            if [ "${REWARDS_SOURCE:-}" = "manifest" ] && [ "${REWARDS_BOUND:-}" = "1" ] && [ -n "${REVENUE_VAULT:-}" ] && [ -n "${REWARDS:-}" ]; then
              gh variable set ARAF_REVENUE_VAULT_ADDRESS --body "$REVENUE_VAULT" --repo "$GITHUB_REPOSITORY"
              gh variable set ARAF_REWARDS_ADDRESS --body "$REWARDS" --repo "$GITHUB_REPOSITORY"
              echo "Repository variables ARAF_REVENUE_VAULT_ADDRESS / ARAF_REWARDS_ADDRESS updated."
            fi
          else
            echo "::warning::GH_VARIABLES_TOKEN secret is not set; repo variables were NOT updated. Run the gh variable set commands from the job summary manually."
          fi

      - name: Print deployment summary
        if: ${{ always() }}
        shell: bash
        env:
          FINAL_OWNER_ADDRESS: ${{ vars.FINAL_OWNER_ADDRESS }}
        run: |
          set -euo pipefail
          {
            echo "### Base Sepolia deployment"
            echo "- Final owner (escrow; vault/rewards when deployed): ${FINAL_OWNER_ADDRESS:-n/a}"
            echo "- Backend: https://$FLY_APP_NAME.fly.dev"
            echo "- Frontend domain (SIWE/CORS): https://$FRONTEND_DOMAIN"
            echo "- ARAF_ESCROW_ADDRESS: ${ESCROW:-n/a}"
            echo "- BASE_SEPOLIA_USDT_ADDRESS: ${USDT:-n/a}"
            echo "- BASE_SEPOLIA_USDC_ADDRESS: ${USDC:-n/a}"
            echo "- ARAF_DEPLOYMENT_BLOCK: ${DEPLOY_BLOCK:-n/a}"
            echo "- ARAF_REVENUE_VAULT_ADDRESS: ${REVENUE_VAULT:-n/a} (source: ${REWARDS_SOURCE:-n/a})"
            echo "- ARAF_REWARDS_ADDRESS: ${REWARDS:-n/a}"
            if [ "${REWARDS_UNBOUND:-}" = "1" ]; then
              echo ""
              echo "**vault/rewards bu escrow'a bağlı değil, runtime'a verilmedi (Fly/Vercel değerleri boşaltıldı); deploy_rewards=true ile yeniden çalıştırın.** (vault/rewards are not bound to this escrow; not given to the runtime.)"
            fi
            if [ "${REWARDS_SOURCE:-}" = "manifest" ]; then
              echo ""
              echo "Manual (escrow owner / multisig, NOT done by this workflow): run REWARDS_OP=verify, then switch the escrow treasury to the vault with REWARDS_OP=switch-treasury (docs/EN/DEPLOYMENT_GUIDE.md)."
            fi
            echo ""
            echo "Next (GITHUB_TOKEN cannot write repo variables; run locally, see docs/EN/DEPLOY_BASE_SEPOLIA.md):"
            echo '```'
            echo "gh variable set ARAF_ESCROW_ADDRESS --body ${ESCROW:-<address>}"
            echo "gh variable set ARAF_DEPLOYMENT_BLOCK --body ${DEPLOY_BLOCK:-<block>}"
            if [ -n "${TEST_USDT_ADDRESS:-}" ]; then echo "gh variable set BASE_SEPOLIA_USDT_ADDRESS --body $TEST_USDT_ADDRESS"; fi
            if [ "${REWARDS_SOURCE:-}" = "manifest" ]; then
              echo "gh variable set ARAF_REVENUE_VAULT_ADDRESS --body ${REVENUE_VAULT:-<address>}"
              echo "gh variable set ARAF_REWARDS_ADDRESS --body ${REWARDS:-<address>}"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/deploy.log" "$RUNNER_TEMP/deploy-rewards.log" contracts/.env
