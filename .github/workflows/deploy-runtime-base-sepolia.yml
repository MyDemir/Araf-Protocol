name: Deploy Runtime Base Sepolia

# Kontratı yeniden deploy ETMEDEN backend (Fly.io) ve/veya frontend (Vercel) deploy eder.
# Adresler repo variables'tan (ARAF_ESCROW_ADDRESS, BASE_SEPOLIA_USDT/USDC_ADDRESS, ARAF_DEPLOYMENT_BLOCK)
# ya da girdi override'larından gelir.

on:
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: "Deploy backend to Fly with the existing contract addresses"
        required: false
        default: true
        type: boolean
      deploy_frontend:
        description: "Deploy frontend to Vercel with the existing contract addresses"
        required: false
        default: false
        type: boolean
      araf_escrow_address:
        description: "Optional override for ARAF_ESCROW_ADDRESS. Empty = repository variable ARAF_ESCROW_ADDRESS."
        required: false
        default: ""
        type: string
      usdt_address:
        description: "Optional override for USDT address. Empty = repository variable BASE_SEPOLIA_USDT_ADDRESS."
        required: false
        default: ""
        type: string
      usdc_address:
        description: "Optional override for USDC address. Empty = repository variable BASE_SEPOLIA_USDC_ADDRESS."
        required: false
        default: ""
        type: string
      deployment_block:
        description: "Optional override for ARAF_DEPLOYMENT_BLOCK. Empty = repository variable ARAF_DEPLOYMENT_BLOCK."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-base-sepolia
  cancel-in-progress: false

jobs:
  runtime-deploy:
    name: Deploy backend/frontend without redeploying contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FLY_APP_NAME: ${{ vars.FLY_APP_NAME || 'araf-protocol-backend' }}
      FRONTEND_DOMAIN: ${{ vars.FRONTEND_DOMAIN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve fixed Base Sepolia deployment values
        shell: bash
        env:
          VAR_ARAF_ESCROW_ADDRESS: ${{ vars.ARAF_ESCROW_ADDRESS }}
          VAR_BASE_SEPOLIA_USDT_ADDRESS: ${{ vars.BASE_SEPOLIA_USDT_ADDRESS }}
          VAR_BASE_SEPOLIA_USDC_ADDRESS: ${{ vars.BASE_SEPOLIA_USDC_ADDRESS }}
          VAR_ARAF_DEPLOYMENT_BLOCK: ${{ vars.ARAF_DEPLOYMENT_BLOCK }}
          INPUT_ARAF_ESCROW_ADDRESS: ${{ inputs.araf_escrow_address }}
          INPUT_USDT_ADDRESS: ${{ inputs.usdt_address }}
          INPUT_USDC_ADDRESS: ${{ inputs.usdc_address }}
          INPUT_DEPLOYMENT_BLOCK: ${{ inputs.deployment_block }}
        run: |
          set -euo pipefail

          ESCROW="${INPUT_ARAF_ESCROW_ADDRESS:-$VAR_ARAF_ESCROW_ADDRESS}"
          USDT="${INPUT_USDT_ADDRESS:-$VAR_BASE_SEPOLIA_USDT_ADDRESS}"
          USDC="${INPUT_USDC_ADDRESS:-$VAR_BASE_SEPOLIA_USDC_ADDRESS}"
          DEPLOY_BLOCK="${INPUT_DEPLOYMENT_BLOCK:-$VAR_ARAF_DEPLOYMENT_BLOCK}"

          ADDRESS_RE='^0x[a-fA-F0-9]{40}$'
          ZERO='0x0000000000000000000000000000000000000000'
          [[ "$ESCROW" =~ $ADDRESS_RE && "$ESCROW" != "$ZERO" ]] || { echo "::error::ARAF_ESCROW_ADDRESS is missing or invalid."; exit 1; }
          [[ "$USDT" =~ $ADDRESS_RE && "$USDT" != "$ZERO" ]] || { echo "::error::BASE_SEPOLIA_USDT_ADDRESS is missing or invalid."; exit 1; }
          [[ "$USDC" =~ $ADDRESS_RE && "$USDC" != "$ZERO" ]] || { echo "::error::BASE_SEPOLIA_USDC_ADDRESS is missing or invalid."; exit 1; }
          [[ "$DEPLOY_BLOCK" =~ ^[0-9]+$ ]] || { echo "::error::ARAF_DEPLOYMENT_BLOCK is missing or invalid."; exit 1; }
          [[ "$DEPLOY_BLOCK" != "0" ]] || { echo "::error::ARAF_DEPLOYMENT_BLOCK cannot be 0 for a production runtime deploy."; exit 1; }

          {
            echo "ESCROW=$ESCROW"
            echo "USDT=$USDT"
            echo "USDC=$USDC"
            echo "DEPLOY_BLOCK=$DEPLOY_BLOCK"
          } >> "$GITHUB_ENV"

      - name: Validate backend config
        if: ${{ inputs.deploy_backend }}
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MASTER_ENCRYPTION_KEY: ${{ secrets.MASTER_ENCRYPTION_KEY }}
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
          BASE_SEPOLIA_WS_RPC_URL: ${{ secrets.BASE_SEPOLIA_WS_RPC_URL }}
        run: |
          set -euo pipefail
          need() { test -n "${!1}" || { echo "::error::$1 is required (see docs/EN/DEPLOY_BASE_SEPOLIA.md)."; exit 1; }; }

          need FRONTEND_DOMAIN
          for n in FLY_API_TOKEN MONGODB_URI REDIS_URL JWT_SECRET MASTER_ENCRYPTION_KEY BASE_SEPOLIA_RPC_URL BASE_SEPOLIA_WS_RPC_URL; do need "$n"; done

          [[ "$FRONTEND_DOMAIN" != http* && "$FRONTEND_DOMAIN" != */* ]] || { echo "::error::FRONTEND_DOMAIN must be a bare host (no https://, no path)."; exit 1; }
          [[ "$FRONTEND_DOMAIN" != "localhost" ]] || { echo "::error::FRONTEND_DOMAIN cannot be localhost."; exit 1; }
          [[ "$BASE_SEPOLIA_RPC_URL" == http* ]] || { echo "::error::BASE_SEPOLIA_RPC_URL must be http(s)."; exit 1; }
          [[ "$BASE_SEPOLIA_WS_RPC_URL" == wss://* ]] || { echo "::error::BASE_SEPOLIA_WS_RPC_URL must start with wss:// (backend eventListener only uses wss://; ws:// silently falls back to HTTP)."; exit 1; }
          [[ "$REDIS_URL" == rediss://* ]] || { echo "::error::REDIS_URL must be rediss:// (backend requires Redis TLS in production)."; exit 1; }
          [[ ${#JWT_SECRET} -ge 64 ]] || { echo "::error::JWT_SECRET must be at least 64 characters."; exit 1; }
          # Mirrors backend siwe.js SEC-02 (known placeholders + Shannon entropy >= 3.5); never prints the secret.
          python3 - <<'PY' || { echo "::error::JWT_SECRET is a known placeholder or has too low entropy (backend siwe.js would reject it)."; exit 1; }
          import math, os, sys
          s = os.environ["JWT_SECRET"]
          if any(p in s for p in ["CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_MIN_64_CHARS", "your-secret-here", "supersecretkey", "changeme"]):
              sys.exit(1)
          h = -sum((s.count(c) / len(s)) * math.log2(s.count(c) / len(s)) for c in set(s))
          sys.exit(1 if h < 3.5 else 0)
          PY
          [[ "$MASTER_ENCRYPTION_KEY" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "::error::MASTER_ENCRYPTION_KEY must be exactly 64 hex characters."; exit 1; }

      - name: Setup Fly CLI
        if: ${{ inputs.deploy_backend }}
        uses: superfly/flyctl-actions/setup-flyctl@1.5

      - name: Stage backend secrets on Fly
        if: ${{ inputs.deploy_backend }}
        working-directory: backend
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MASTER_ENCRYPTION_KEY: ${{ secrets.MASTER_ENCRYPTION_KEY }}
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
          BASE_SEPOLIA_WS_RPC_URL: ${{ secrets.BASE_SEPOLIA_WS_RPC_URL }}
          RELAYER_PRIVATE_KEY: ${{ secrets.RELAYER_PRIVATE_KEY }}
          ADMIN_WALLETS: ${{ vars.ADMIN_WALLETS }}
          REVENUE_VAULT_ADDRESS: ${{ vars.ARAF_REVENUE_VAULT_ADDRESS }}
          REWARDS_ADDRESS: ${{ vars.ARAF_REWARDS_ADDRESS }}
        run: |
          set -euo pipefail
          ADDRESS_RE='^0x[a-fA-F0-9]{40}$'
          for n in REVENUE_VAULT_ADDRESS REWARDS_ADDRESS; do
            if [ -n "${!n}" ] && ! [[ "${!n}" =~ $ADDRESS_RE ]]; then echo "::error::$n variable must be a 0x + 40 hex address."; exit 1; fi
          done
          {
            printf '%s=%s\n' NODE_ENV production
            printf '%s=%s\n' MONGODB_URI "$MONGODB_URI"
            printf '%s=%s\n' REDIS_URL "$REDIS_URL"
            printf '%s=%s\n' JWT_SECRET "$JWT_SECRET"
            printf '%s=%s\n' JWT_EXPIRES_IN 15m
            printf '%s=%s\n' PII_TOKEN_EXPIRES_IN 15m
            printf '%s=%s\n' KMS_PROVIDER env
            printf '%s=%s\n' ALLOW_ENV_KMS_ON_TESTNET yes
            printf '%s=%s\n' MASTER_ENCRYPTION_KEY "$MASTER_ENCRYPTION_KEY"
            printf '%s=%s\n' EXPECTED_CHAIN_ID 84532
            printf '%s=%s\n' BASE_RPC_URL "$BASE_SEPOLIA_RPC_URL"
            printf '%s=%s\n' BASE_WS_RPC_URL "$BASE_SEPOLIA_WS_RPC_URL"
            printf '%s=%s\n' ARAF_ESCROW_ADDRESS "$ESCROW"
            printf '%s=%s\n' BASE_SEPOLIA_USDT_ADDRESS "$USDT"
            printf '%s=%s\n' BASE_SEPOLIA_USDC_ADDRESS "$USDC"
            printf '%s=%s\n' ARAF_DEPLOYMENT_BLOCK "$DEPLOY_BLOCK"
            printf '%s=%s\n' SIWE_DOMAIN "$FRONTEND_DOMAIN"
            printf '%s=%s\n' SIWE_URI "https://$FRONTEND_DOMAIN"
            printf '%s=%s\n' ALLOWED_ORIGINS "https://$FRONTEND_DOMAIN"
            if [ -n "$RELAYER_PRIVATE_KEY" ]; then printf '%s=%s\n' RELAYER_PRIVATE_KEY "$RELAYER_PRIVATE_KEY"; fi
            if [ -n "$ADMIN_WALLETS" ]; then printf '%s=%s\n' ADMIN_WALLETS "$ADMIN_WALLETS"; fi
            if [ -n "$REVENUE_VAULT_ADDRESS" ]; then printf '%s=%s\n' ARAF_REVENUE_VAULT_ADDRESS "$REVENUE_VAULT_ADDRESS"; fi
            if [ -n "$REWARDS_ADDRESS" ]; then printf '%s=%s\n' ARAF_REWARDS_ADDRESS "$REWARDS_ADDRESS"; fi
          } | flyctl secrets import --stage -a "$FLY_APP_NAME"

      - name: Deploy backend to Fly
        if: ${{ inputs.deploy_backend }}
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only -a "$FLY_APP_NAME"

      - name: Check backend health
        if: ${{ inputs.deploy_backend }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 15
          curl --fail --show-error --silent --retry 12 --retry-delay 10 --retry-all-errors "https://$FLY_APP_NAME.fly.dev/health"

      - name: Validate Vercel config
        if: ${{ inputs.deploy_frontend }}
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "::error::VERCEL_TOKEN secret is required when deploy_frontend is true."; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "::error::VERCEL_ORG_ID secret is required when deploy_frontend is true."; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "::error::VERCEL_PROJECT_ID secret is required when deploy_frontend is true."; exit 1; }

      - name: Setup Node
        if: ${{ inputs.deploy_frontend }}
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Repo dosyası değişmez; yalnız runner üzerindeki kopyada /api rewrite hedefi FLY_APP_NAME'e çevrilir.
      - name: Point vercel.json /api rewrite at Fly app
        if: ${{ inputs.deploy_frontend }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FLY_APP_NAME" =~ ^[a-z0-9-]+$ ]] || { echo "::error::FLY_APP_NAME must match ^[a-z0-9-]+$."; exit 1; }
          node -e '
            const fs = require("fs");
            const p = "frontend/vercel.json";
            const cfg = JSON.parse(fs.readFileSync(p, "utf8"));
            const r = (cfg.rewrites || []).find((x) => x.source === "/api/(.*)");
            if (!r) throw new Error("vercel.json has no /api/(.*) rewrite");
            r.destination = "https://" + process.env.FLY_APP_NAME + ".fly.dev/api/$1";
            fs.writeFileSync(p, JSON.stringify(cfg, null, 2) + "\n");
            console.log("vercel.json /api rewrite destination: " + r.destination);
          '

      - name: Install Vercel CLI
        if: ${{ inputs.deploy_frontend }}
        run: npm install -g vercel@62.7.0

      # VITE_API_URL bilerek verilmez: frontend/src/app/apiConfig.js prod'da mutlak URL'i reddeder, /api rewrite kullanılır.
      - name: Deploy frontend to Vercel
        if: ${{ inputs.deploy_frontend }}
        working-directory: frontend
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_RPC_URL: ${{ vars.VITE_RPC_URL }}
          VITE_BASE_APP_ID: ${{ vars.VITE_BASE_APP_ID }}
          FARCASTER_ACCOUNT_ASSOCIATION_HEADER: ${{ vars.FARCASTER_ACCOUNT_ASSOCIATION_HEADER }}
          FARCASTER_ACCOUNT_ASSOCIATION_PAYLOAD: ${{ vars.FARCASTER_ACCOUNT_ASSOCIATION_PAYLOAD }}
          FARCASTER_ACCOUNT_ASSOCIATION_SIGNATURE: ${{ vars.FARCASTER_ACCOUNT_ASSOCIATION_SIGNATURE }}
          REVENUE_VAULT_ADDRESS: ${{ vars.ARAF_REVENUE_VAULT_ADDRESS }}
          REWARDS_ADDRESS: ${{ vars.ARAF_REWARDS_ADDRESS }}
        run: |
          set -euo pipefail
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          args=(
            --build-env VITE_TARGET_CHAIN=base-sepolia
            --build-env VITE_ESCROW_ADDRESS="$ESCROW"
            --build-env VITE_USDT_ADDRESS="$USDT"
            --build-env VITE_USDC_ADDRESS="$USDC"
            --build-env VITE_PUBLIC_URL="https://$FRONTEND_DOMAIN"
          )
          if [ -n "$VITE_RPC_URL" ]; then args+=(--build-env VITE_RPC_URL="$VITE_RPC_URL"); fi
          # Farcaster / Base mini app (opsiyonel; imza FRONTEND_DOMAIN'e bağlıdır, docs/*/DEPLOY_BASE_SEPOLIA.md)
          if [ -n "$VITE_BASE_APP_ID" ]; then args+=(--build-env VITE_BASE_APP_ID="$VITE_BASE_APP_ID"); fi
          if [ -n "$FARCASTER_ACCOUNT_ASSOCIATION_HEADER" ] && [ -n "$FARCASTER_ACCOUNT_ASSOCIATION_PAYLOAD" ] && [ -n "$FARCASTER_ACCOUNT_ASSOCIATION_SIGNATURE" ]; then
            args+=(--build-env FARCASTER_ACCOUNT_ASSOCIATION_HEADER="$FARCASTER_ACCOUNT_ASSOCIATION_HEADER")
            args+=(--build-env FARCASTER_ACCOUNT_ASSOCIATION_PAYLOAD="$FARCASTER_ACCOUNT_ASSOCIATION_PAYLOAD")
            args+=(--build-env FARCASTER_ACCOUNT_ASSOCIATION_SIGNATURE="$FARCASTER_ACCOUNT_ASSOCIATION_SIGNATURE")
          fi
          ADDRESS_RE='^0x[a-fA-F0-9]{40}$'
          for n in REVENUE_VAULT_ADDRESS REWARDS_ADDRESS; do
            if [ -n "${!n}" ] && ! [[ "${!n}" =~ $ADDRESS_RE ]]; then echo "::error::$n variable must be a 0x + 40 hex address."; exit 1; fi
          done
          if [ -n "$REVENUE_VAULT_ADDRESS" ]; then args+=(--build-env VITE_REVENUE_VAULT_ADDRESS="$REVENUE_VAULT_ADDRESS"); fi
          if [ -n "$REWARDS_ADDRESS" ]; then args+=(--build-env VITE_REWARDS_ADDRESS="$REWARDS_ADDRESS"); fi
          vercel deploy --prod --yes --token="$VERCEL_TOKEN" "${args[@]}"

      - name: Deployment summary
        if: ${{ always() }}
        shell: bash
        env:
          DEPLOY_BACKEND: ${{ inputs.deploy_backend }}
          DEPLOY_FRONTEND: ${{ inputs.deploy_frontend }}
        run: |
          {
            echo "### Runtime Base Sepolia deployment"
            echo "- Backend deployed: $DEPLOY_BACKEND (https://$FLY_APP_NAME.fly.dev)"
            echo "- Frontend deployed: $DEPLOY_FRONTEND (https://$FRONTEND_DOMAIN)"
            echo "- ARAF_ESCROW_ADDRESS: ${ESCROW:-n/a}"
            echo "- BASE_SEPOLIA_USDT_ADDRESS: ${USDT:-n/a}"
            echo "- BASE_SEPOLIA_USDC_ADDRESS: ${USDC:-n/a}"
            echo "- ARAF_DEPLOYMENT_BLOCK: ${DEPLOY_BLOCK:-n/a}"
          } >> "$GITHUB_STEP_SUMMARY"
