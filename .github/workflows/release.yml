name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example v3.0.0)'
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # K4-08: Yayın, aynı commit için CI workflow'unun başarılı bir koşusu olmadan yapılmaz (tag push ya da dispatch).
      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" --jq '.total_count')"
          if ! [[ "$count" =~ ^[0-9]+$ ]] || [ "$count" -lt 1 ]; then
            echo "::error::No successful CI run found for commit $GITHUB_SHA. Release refused."
            exit 1
          fi
          echo "CI succeeded for $GITHUB_SHA ($count run(s))."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid tag: $TAG"
            exit 1
          fi
          NOTES="docs/releases/${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::Release notes file not found: $NOTES"
            exit 1
          fi
          if [[ "$TAG" == *-* ]]; then
            PRE=--prerelease
          else
            PRE=--prerelease=false
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Araf Protocol $TAG" --notes-file "$NOTES" "$PRE"
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Araf Protocol $TAG" --notes-file "$NOTES" --verify-tag "$PRE"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Tag does not exist: gh creates it at the dispatched commit.
            gh release create "$TAG" --title "Araf Protocol $TAG" --notes-file "$NOTES" --target "$GITHUB_SHA" "$PRE"
          else
            echo "::error::Tag $TAG not found on remote for event $GITHUB_EVENT_NAME"
            exit 1
          fi
