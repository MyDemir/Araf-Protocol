<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- [TR] Ana ekrana eklenince tarayıcı çubukları olmadan (standalone) açılır. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0c0c0e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Araf" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="Araf Protocol is a non-custodial P2P escrow app built for Base." />
    <!-- [TR] og/twitter/fc:* ve base:app_id etiketleri build sırasında (build/miniappMeta.js) eklenir. -->
    <title>Araf Protocol | P2P Escrow</title>
  </head>
  <body class="bg-slate-900 text-white">
    <div id="root"></div>
    <noscript>Araf Protocol JavaScript gerektirir. / Araf Protocol requires JavaScript.</noscript>
    <!-- [TR] Açılış bekçisi: ana paket yüklenemez/donarsa (eski deploy, ağ kesintisi) beyaz ekran yerine "yenile" gösterir.
         [EN] Boot watchdog: if the main bundle fails or hangs, show a reload prompt instead of a white screen. -->
    <script>
      setTimeout(function () {
        var r = document.getElementById('root');
        if (r && r.childElementCount === 0) {
          var b = document.createElement('div');
          b.setAttribute('role', 'alert');
          b.style.cssText = 'padding:2rem;font-family:sans-serif;text-align:center';
          var p = document.createElement('p');
          p.textContent = 'Uygulama yüklenemedi; bağlantınızı kontrol edip yenileyin. / The app failed to load; check your connection and reload.';
          var k = document.createElement('button');
          k.type = 'button';
          k.textContent = 'Yeniden yükle / Reload';
          k.onclick = function () { window.location.reload(); };
          b.appendChild(p); b.appendChild(k); r.appendChild(b);
        }
      }, 10000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
